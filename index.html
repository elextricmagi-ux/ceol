<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chordstand</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12161f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chordstand">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#12161f; --panel:#1a2030; --panel2:#222a3d; --line:#2b3550;
  --ink:#e9e7e0; --dim:#98a0b5; --chord:#f2b84b; --accent:#8fa2ff; --accent-ink:#0d1226; --danger:#ff7a7a;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Noto Serif",serif;
  --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme=dark]){
    --bg:#eef0f4; --panel:#ffffff; --panel2:#e3e7ef; --line:#cdd3e1;
    --ink:#1b2030; --dim:#59627a; --chord:#a63f0b; --accent:#3a4cd0; --accent-ink:#ffffff; --danger:#c62828;
    color-scheme:light;
  }
}
:root[data-theme=light]{
  --bg:#eef0f4; --panel:#ffffff; --panel2:#e3e7ef; --line:#cdd3e1;
  --ink:#1b2030; --dim:#59627a; --chord:#a63f0b; --accent:#3a4cd0; --accent-ink:#ffffff; --danger:#c62828;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 var(--sans);overscroll-behavior:none}
#app{height:100%;display:flex;flex-direction:column;max-width:1100px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 12px 8px 16px;flex:none}
.brand{font:700 26px/1 var(--serif);margin:0;letter-spacing:.01em}
.sp{flex:1}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.ib:active{background:var(--panel2)}
.view{flex:1;min-height:0;display:flex;flex-direction:column}

/* library */
.searchwrap{position:relative;margin:4px 16px 10px;flex:none}
.searchwrap .si{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--dim);display:grid}
.searchwrap input{width:100%;height:52px;border-radius:26px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:17px;padding:0 18px 0 48px}
.searchwrap input::placeholder{color:var(--dim)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;flex:none;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);color:var(--dim);font-size:15px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip.add{border-style:dashed}
.listbar{display:flex;align-items:center;gap:14px;padding:0 20px 8px;color:var(--dim);font-size:14px;flex:none}
.listbar span{flex:1}
.listbar button{color:var(--accent);padding:6px 0}
.list{flex:1;overflow-y:auto;padding:0 10px calc(110px + env(safe-area-inset-bottom))}
.row{display:flex;align-items:center;gap:8px;padding:12px 8px 12px 10px;border-radius:14px;cursor:pointer}
.row:active{background:var(--panel)}
.row + .row{border-top:1px solid var(--line)}
.rm{flex:1;min-width:0}
.rtitle{font:600 19px/1.25 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rartist{color:var(--dim);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.keychip{font:600 13px var(--mono);color:var(--chord);border:1px solid var(--line);border-radius:8px;padding:3px 7px}
.star{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--dim)}
.star.on{color:var(--chord)}
.star.on svg{fill:currentColor}
.mv{display:flex}
.mv button{width:36px;height:44px;display:grid;place-items:center;color:var(--dim)}
.empty{text-align:center;color:var(--dim);padding:56px 28px}
.empty h2{font:700 22px var(--serif);color:var(--ink);margin:0 0 8px}
.empty p{margin:0 auto 20px;max-width:34ch}
.fab{position:fixed;right:max(18px,calc(50% - 532px));bottom:calc(20px + env(safe-area-inset-bottom));height:56px;padding:0 22px 0 16px;border-radius:28px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.btn{height:48px;padding:0 20px;border-radius:24px;background:var(--accent);color:var(--accent-ink);font-weight:700;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:600}
.btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}

/* player */
.ptitle{flex:1;min-width:0}
.ptitle .t{font:700 20px/1.2 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptitle .a{color:var(--dim);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{color:var(--dim);font-size:13px;min-width:34px;text-align:center}
.scroller{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:6px 20px 0;border-top:1px solid var(--line)}
.notes{color:var(--dim);font-style:italic;font-size:15px;margin:10px 0 4px;max-width:70ch;white-space:pre-wrap}
.chart{font-family:var(--mono);font-size:var(--fs,17px);line-height:1.38;white-space:pre;width:max-content;min-width:100%;padding-top:6px}
.l.c{color:var(--chord);font-weight:700}
.l.t{color:var(--ink)}
.l.s{font:700 .8em/1.2 var(--sans);color:var(--accent);margin-top:1.4em;margin-bottom:.15em;letter-spacing:.02em}
.l.b{height:.75em}
.endpad{height:70vh}
.dock{flex:none;background:var(--panel);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.dock-row{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.dock.min .tune{display:none}
.grp{display:flex;align-items:center;gap:4px;background:var(--panel2);border-radius:26px;padding:3px}
.b{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:600}
.b:active{background:var(--line)}
.b.fs1{font-size:14px}.b.fs2{font-size:21px}
.keybox{min-width:88px;text-align:center;line-height:1.1;padding:2px 4px}
.keybox .k{font:700 18px var(--mono);color:var(--chord)}
.keybox .ks{font-size:11.5px;color:var(--dim);margin-top:2px}
.playbtn{width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.playbtn svg{width:28px;height:28px}
.speed{display:flex;align-items:center;gap:2px;flex:1;min-width:200px;max-width:420px}
.speed input{flex:1;accent-color:var(--accent);height:44px;min-width:60px}
.speed .sv{width:26px;text-align:center;font:600 15px var(--mono);color:var(--dim)}


/* tappable chords + voicing diagrams */
.ch{display:inline-block;padding:9px 4px;margin:-9px -4px;border-radius:6px;cursor:pointer}
.ch:active{background:var(--panel2)}
@media (hover:hover){.ch:hover{background:var(--panel2)}}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin:10px 0 6px}
.vcard{background:var(--panel2);border-radius:14px;padding:8px 6px 10px;text-align:center}
.vd{width:100%;height:auto;max-width:132px;stroke:none;fill:none}
.vd .gl{stroke:var(--dim);stroke-width:.9}
.vd .nut{fill:var(--ink)}
.vd .dot{fill:var(--chord)}
.vd .mk{fill:none;stroke:var(--ink);stroke-width:1.4;stroke-linecap:round}
.vd .fl{fill:var(--ink);stroke:none;font:600 10px var(--sans)}
.vl{font-size:13px;color:var(--dim);margin-top:2px}
.sheet .tones{color:var(--dim);margin:0 4px 4px;font-size:15px}

/* forms */
.form{flex:1;overflow-y:auto;padding:4px 16px calc(40px + env(safe-area-inset-bottom));max-width:760px;width:100%;margin:0 auto}
label.f{display:block;margin:14px 0 6px;font-weight:600;font-size:14px;color:var(--dim)}
input.t,textarea.t,select.t{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:17px;padding:12px 14px}
textarea.t{font-family:var(--mono);font-size:14px;line-height:1.35;white-space:pre;overflow:auto;min-height:46vh;resize:vertical}
.hint{color:var(--dim);font-size:13.5px;margin:6px 2px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.find{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;color:var(--dim);font-size:13.5px}
.find a{color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:14px;padding:5px 11px}
h2.sec{font:700 20px var(--serif);margin:28px 0 4px}
.status{font-size:14px;color:var(--dim);margin:8px 0;min-height:1.4em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px 14px 14px;margin-top:10px}

/* sheet + toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--panel);border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto;max-height:80vh;overflow-y:auto}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:2px auto 10px}
.sheet h3{font:700 19px var(--serif);margin:6px 4px 8px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 8px;border-radius:12px;font-size:17px}
.item:active{background:var(--panel2)}
.item.danger{color:var(--danger)}
.item .ck{width:24px;height:24px;border:2px solid var(--line);border-radius:7px;display:grid;place-items:center;flex:none}
.item .ck.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.item .ck svg{width:16px;height:16px;stroke-width:3}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:15px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
// <PURE>
/* ================= chord logic (pure, unit-tested) ================= */
const NOTES_S=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const NOTES_F=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const ROOT_IDX={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
const normAcc=s=>s.replace(/\u266F/g,'#').replace(/\u266D/g,'b');
const CHORD_RE=/^([A-G][#b\u266F\u266D]?)((?:maj|min|dim|aug|sus|add|no|alt|[mM+\u00B0\u00F8\-]|\d+|[#b\u266F\u266D]|\([^)\s]*\))*)(?:\/([A-G][#b\u266F\u266D]?))?$/;
const FILLER=/^(?:N\.?C\.?|[|\/\-\u2013:]+|\(?x\d+\)?|\d+x|\.+)$/i;
const SECTION_RE=/^[\[(]?(?:intro|verse|chorus|pre[- ]?chorus|bridge|outro|solo|interlude|instrumental|refrain|tag|hook|break|coda)(?:\s*(?:\d+|x\d+|[a-z]))?[\])]?:?$/i;

function splitChordToken(t){
  if(CHORD_RE.test(t)) return ['',t,''];
  const m=t.match(/^(\(*)(.+?)([),.;:]*)$/);
  if(m && CHORD_RE.test(m[2])) return [m[1],m[2],m[3]];
  return null;
}
function isChordTokens(s){
  let n=0;
  for(const t of s.trim().split(/\s+/)){
    if(splitChordToken(t)) n++;
    else if(!FILLER.test(t)) return false;
  }
  return n>0;
}
function classify(line){
  const s=line.trim();
  if(!s) return 'blank';
  if(/^\[[^\]]+\]:?$/.test(s) && !CHORD_RE.test(s.replace(/^\[|\]:?$/g,''))) return 'section';
  if(SECTION_RE.test(s)) return 'section';
  if(isChordTokens(s)) return 'chord';
  const m=s.match(/^([A-Za-z][A-Za-z0-9 \-]{0,20}:)\s+(.+)$/);
  if(m && isChordTokens(m[2])) return 'chord';
  return 'text';
}
function transposeChord(ch,semis,flats){
  if(!semis) return ch;
  const m=ch.match(CHORD_RE); if(!m) return ch;
  const conv=r=>{const i=ROOT_IDX[normAcc(r)];const n=((i+semis)%12+12)%12;return (flats?NOTES_F:NOTES_S)[n];};
  return conv(m[1])+m[2]+(m[3]?'/'+conv(m[3]):'');
}
function transposeChordLine(line,semis,flats){
  let out='';
  const re=/\S+/g; let m;
  while((m=re.exec(line))){
    const col=m.index;
    if(out.length<col) out+=' '.repeat(col-out.length);
    else if(out.length>0 && !/\s$/.test(out)) out+=' ';
    const p=splitChordToken(m[0]);
    out+=p?p[0]+transposeChord(p[1],semis,flats)+p[2]:m[0];
  }
  return out;
}
const FLAT_MAJ=[5,10,3,8,1,6], FLAT_MIN=[2,7,0,5,10,3];
function isFlatKey(k){return !!k && (k.minor?FLAT_MIN:FLAT_MAJ).includes(((k.root%12)+12)%12);}
function keyName(k){
  if(!k) return '';
  const r=((k.root%12)+12)%12;
  return (isFlatKey({root:r,minor:k.minor})?NOTES_F:NOTES_S)[r]+(k.minor?'m':'');
}
function shiftKey(k,semis){return k?{root:((k.root+semis)%12+12)%12,minor:k.minor}:null;}
function bodyChords(body){
  const out=[];
  for(const l of body.split('\n')) if(classify(l)==='chord')
    for(const t of l.trim().split(/\s+/)){const p=splitChordToken(t); if(p) out.push(p[1]);}
  return out;
}
function estimateKey(body){
  const raw=bodyChords(body); if(!raw.length) return null;
  const ch=raw.map(c=>{const m=c.match(CHORD_RE);return {root:ROOT_IDX[normAcc(m[1])],minor:/^(m(?!aj)|min|dim|\u00B0|\u00F8)/.test(m[2])};});
  const MAJ={0:0,2:1,4:1,5:0,7:0,9:1,11:1}, MIN={0:1,2:1,3:0,5:1,7:2,8:0,10:0}; // 0 major,1 minor,2 either
  let best=null,bs=-1;
  for(let t=0;t<12;t++) for(const minor of [false,true]){
    const tab=minor?MIN:MAJ; let s=0;
    ch.forEach((c,i)=>{
      const d=(c.root-t+12)%12; if(!(d in tab)) return;
      const q=tab[d]; if(q===2||(q===1)===c.minor){ s+=1; if(d===0) s+=.5; }
    });
    const f=ch[0],l=ch[ch.length-1];
    if(f.root===t&&f.minor===minor) s+=2;
    if(l.root===t&&l.minor===minor) s+=2;
    if(s>bs){bs=s;best={root:t,minor};}
  }
  return best;
}
function hasInlineChords(l){
  const re=/\[([^\]]+)\]/g;let m;
  while((m=re.exec(l))) if(CHORD_RE.test(m[1])) return true;
  return false;
}
function inlineToLines(l){
  let lyric='',chord='',last=0,m;const re=/\[([^\]]+)\]/g;
  while((m=re.exec(l))){
    lyric+=l.slice(last,m.index);
    if(CHORD_RE.test(m[1])){
      if(chord.length<lyric.length) chord+=' '.repeat(lyric.length-chord.length);
      else if(chord.length>0) chord+=' ';
      chord+=m[1];
    } else lyric+=m[0];
    last=m.index+m[0].length;
  }
  lyric+=l.slice(last);
  const out=[chord.replace(/\s+$/,'')];
  if(lyric.trim()) out.push(lyric.replace(/\s+$/,''));
  return out;
}
function normalizeImport(raw){
  let t=String(raw||'').replace(/\r\n?/g,'\n').replace(/\u00a0/g,' ').replace(/\t/g,'    ');
  t=t.replace(/\[\/?ch\]/gi,'').replace(/\[\/?tab\]/gi,'');
  let title='',artist='';const out=[];
  for(const l of t.split('\n')){
    const d=l.match(/^\s*\{\s*([a-z_]+)\s*(?::\s*(.*?))?\s*\}\s*$/i);
    if(d){
      const k=d[1].toLowerCase(),v=(d[2]||'').trim();
      if(k==='title'||k==='t') title=title||v;
      else if(k==='artist'||k==='subtitle'||k==='st') artist=artist||v;
      else if(k==='soc'||k==='start_of_chorus') out.push('[Chorus]');
      else if(k==='sov'||k==='start_of_verse') out.push('[Verse]');
      else if(k==='sob'||k==='start_of_bridge') out.push('[Bridge]');
      else if((k==='comment'||k==='c'||k==='ci')&&v) out.push('['+v+']');
      continue;
    }
    if(hasInlineChords(l)){out.push(...inlineToLines(l));continue;}
    out.push(l.replace(/\s+$/,''));
  }
  while(out.length&&!out[0].trim()) out.shift();
  while(out.length&&!out[out.length-1].trim()) out.pop();
  if(!title&&out.length){
    const m=out[0].match(/^(.+?)\s+(?:(?:ukulele\s+)?chords?|tabs?)\s+by\s+(.+)$/i);
    if(m&&out[0].length<90){title=m[1].trim();artist=artist||m[2].trim();out.shift();while(out.length&&!out[0].trim()) out.shift();}
  }
  return {title,artist,body:out.join('\n').replace(/\n{3,}/g,'\n\n')};
}
/* ===== voicings (guitar, standard tuning) ===== */
const OPEN_PC=[4,9,2,7,11,4];
function parseChordName(name){
  const m=name.match(CHORD_RE); if(!m) return null;
  const root=ROOT_IDX[normAcc(m[1])], bass=m[3]?ROOT_IDX[normAcc(m[3])]:null;
  let q=normAcc(m[2]);
  if(q==='5') return {root,bass,ints:[0,7],req:[0,7],fifth:7};
  let third=4,fifth=7;
  const adds=[],alts=[];let sus=null;
  q=q.replace(/add(\d+)/g,(_,n)=>{adds.push(+n);return '';});
  q=q.replace(/sus(\d)?/,(_,n)=>{sus=n?+n:4;return '';});
  q=q.replace(/([#b])(5|9|11|13)/g,(_,a,n)=>{alts.push([a,+n]);return '';});
  q=q.replace(/no\d+/g,'');
  const half=/\u00F8/.test(q);
  const isMin=half||/^(min|m(?!aj)|-)/.test(q), isDim=half||/dim|\u00B0/.test(q), isAug=/aug|\+/.test(q);
  const majSev=/maj|Maj|M(?=\d)|\u0394/.test(q);
  let ext=+((q.match(/13|11|9|7/)||[])[0])||0; if(half&&!ext) ext=7;
  const six=/6/.test(q.replace(/13/,''));
  if(isMin) third=3; if(isDim){third=3;fifth=6;} if(isAug) fifth=8;
  if(sus) third=sus===2?2:5;
  let seventh=null;
  if(ext) seventh=majSev?11:(isDim&&!half&&ext===7?9:10);
  let fifthAltered=false;
  const set=new Set([0,third,fifth]);
  if(seventh!=null) set.add(seventh);
  if(ext>=9) set.add(2); if(ext>=11) set.add(5); if(ext>=13) set.add(9); if(six) set.add(9);
  for(const n of adds) set.add({2:2,9:2,4:5,11:5,6:9}[n]);
  const swap=(o,n)=>{set.delete(o);set.add(n);};
  for(const [a,n] of alts){
    if(n===5){const nf=a==='b'?6:8;swap(fifth,nf);fifth=nf;fifthAltered=true;}
    else if(n===9) swap(2,a==='b'?1:3);
    else if(n===11) swap(5,6);
    else if(n===13) swap(9,8);
  }
  const ints=[...set].sort((a,b)=>a-b),req=new Set(ints);
  if(ints.length>=4&&!fifthAltered) req.delete(fifth);
  if(ext>=13){req.delete(2);req.delete(5);} else if(ext===11) req.delete(2);

}
function chordLineHTML(line){
  return line.replace(/\S+/g,tok=>{
    const p=splitChordToken(tok);
    return p?esc(p[0])+'<span class="ch" role="button" tabindex="0" data-ch="'+esc(p[1])+'">'+esc(p[1])+'</span>'+esc(p[2]):esc(tok);
  });
}
function chordSheet(name){
  stopScroll();
  const s=P.song,cp=s.capo||0,vs=chordVoicings(name),notes=chordNotes(name);
  let sub=notes.length?'Notes: '+notes.join(' '):'';
  if(cp) sub+=(sub?'. ':'')+'With capo '+cp+' this sounds as '+transposeChord(name,cp,useFlats(s,s.transpose||0))+'.';
  openSheet('<h3>'+esc(name)+'</h3>'+(sub?'<div class="tones">'+esc(sub)+'</div>':'')+
    (vs.length?'<div class="vgrid">'+vs.map(v=>'<div class="vcard">'+diagramSVG(v)+'<div class="vl">'+esc(v.label)+'</div></div>').join('')+'</div>'
      +'<p class="hint">Standard tuning, low E string on the left.</p>'
      :'<p class="hint">No easy fingerings found for this chord.</p>'));
}
function drawChart(){
  const s=P.song,eff=(s.transpose||0)-(s.capo||0),flats=useFlats(s,eff),el=$('#chart');
  el.style.setProperty('--fs',prefs.fs+'px');
  el.innerHTML=s.body.split('\n').map(l=>{
    const c=classify(l);
    if(c==='blank') return '<div class="l b"></div>';
    if(c==='section') return `<div class="l s">${esc(l.trim().replace(/^\[|\]$/g,''))}</div>`;
    if(c==='chord') return `<div class="l c">${chordLineHTML(eff?transposeChordLine(l,eff,flats):l)}</div>`;
    return `<div class="l t">${esc(l)}</div>`;
  }).join('');
  const t=s.transpose||0,cp=s.capo||0;
  const sound=shiftKey(s.key,t),shape=shiftKey(s.key,t-cp);
  $('#kname').textContent=sound?keyName(sound):(t>0?'+'+t:String(t));
  $('#ksub').textContent=s.key?('orig '+keyName(s.key)+(t?' \u00B7 '+(t>0?'+':'')+t:'')):'steps';
  $('#capo').textContent=cp?'Capo '+cp:'No capo';
  $('#capos').textContent=cp&&shape?'shapes in '+keyName(shape):'capo';
}
function persistSong(){touch(P.song);}
function act(a){
  const s=P.song;
  switch(a){
    case 'tp':s.transpose=Math.min(11,(s.transpose||0)+1);drawChart();persistSong();break;
    case 'tm':s.transpose=Math.max(-11,(s.transpose||0)-1);drawChart();persistSong();break;
    case 't0':s.transpose=0;drawChart();persistSong();break;
    case 'cp':s.capo=Math.min(9,(s.capo||0)+1);drawChart();persistSong();break;
    case 'cm':s.capo=Math.max(0,(s.capo||0)-1);drawChart();persistSong();break;
    case 'fp':prefs.fs=Math.min(40,prefs.fs+2);savePrefs();drawChart();break;
    case 'fm':prefs.fs=Math.max(11,prefs.fs-2);savePrefs();drawChart();break;
    case 'sp':case 'sm':{const v=Math.max(1,Math.min(20,(s.speed||6)+(a==='sp'?1:-1)));s.speed=v;$('#spd').value=v;$('#spdv').textContent=v;persistSong();break;}
    case 'play':scrolling?stopScroll():startScroll();break;
    case 'min':{prefs.dockMin=!prefs.dockMin;savePrefs();$('#dock').classList.toggle('min',prefs.dockMin);$('#minbtn').style.transform=prefs.dockMin?'none':'rotate(180deg)';break;}
  }
}
function startScroll(){
  const sc=$('#scroller');if(!sc)return;
  if(sc.scrollHeight<=sc.clientHeight+4){toast('Nothing to scroll yet');return;}
  scrolling=true;pos=sc.scrollTop;lastT=0;held=false;
  $('#play').innerHTML=I.pause;$('#play').setAttribute('aria-label','Pause autoscroll');
  raf=requestAnimationFrame(tick);
}
function stopScroll(){
  scrolling=false;cancelAnimationFrame(raf);
  const b=$('#play');if(b){b.innerHTML=I.play;b.setAttribute('aria-label','Start autoscroll');}
}
function tick(t){
  if(!scrolling)return;
  const sc=$('#scroller');if(!sc){scrolling=false;return;}
  if(!lastT)lastT=t;
  const dt=Math.min(.1,(t-lastT)/1000);lastT=t;
  if(held||Math.abs(sc.scrollTop-pos)>2) pos=sc.scrollTop;
  else{
    pos+=(P.song.speed||6)*5*dt;
    sc.scrollTop=pos;
    if(sc.scrollTop>=sc.scrollHeight-sc.clientHeight-1){stopScroll();toast('End of song');return;}
  }
  raf=requestAnimationFrame(tick);
}
let wl=null;
async function keepAwake(on){
  try{
    if(on&&'wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null;});}
    else if(!on&&wl){await wl.release();wl=null;}
  }catch(e){wl=null;}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&P) keepAwake(true);});

function songMenu(){
  const s=P.song;
  openSheet(`<h3>${esc(s.title||'Untitled')}</h3>
   <button class="item" data-edit>Edit chart</button>
   <button class="item" data-lists>Setlists</button>
   <button class="item danger" data-del>Delete song</button>`);
}
function listsSheet(){
  const s=P.song,ls=liveLists();
  openSheet(`<h3>Setlists</h3>`+
   (ls.length?ls.map(l=>{const on=l.songIds.includes(s.id);return `<button class="item" data-tog="${l.id}"><span class="ck ${on?'on':''}">${on?I.check:''}</span>${esc(l.name)}</button>`;}).join(''):'<p class="hint">No setlists yet.</p>')+
   `<button class="item" data-newlist-song>+ New setlist</button>`);
}

/* ================= add / edit ================= */
function viewEdit(id){
  const s=id?data.songs[id]:null;
  if(id&&(!s||s.deleted)){location.replace('#/');return;}
  let pre={title:'',artist:'',body:''};
  if(!s&&state.share){
    const sh=state.share;state.share=null;
    const n=normalizeImport(sh.text||'');
    if(n.body.split('\n').length>=2) pre={title:n.title||sh.title||'',artist:n.artist,body:n.body};
    else setTimeout(()=>toast('That shared a link, not the chart. Select the chart text first, then share.'),300);
  }
  const v=s||pre;
  app.innerHTML=`<header class="top" style="padding-left:6px"><button class="ib" data-back aria-label="Back">${I.back}</button><h1 class="brand" style="font-size:22px">${s?'Edit song':'Add song'}</h1></header>
  <div class="form">
    <label class="f" for="f-body">Chart text</label>
    <textarea class="t" id="f-body" spellcheck="false" autocapitalize="off" autocorrect="off" wrap="off" placeholder="Paste a chart here: chords above lyrics, or ChordPro [C]inline style.">${esc(v.body||'')}</textarea>
    <div class="hint" id="detect"></div>
    <div class="actions"><button class="btn ghost" id="paste">Paste from clipboard</button><button class="btn ghost" id="clean">Clean up</button></div>
    <label class="f" for="f-title">Title</label><input class="t" id="f-title" value="${esc(v.title||'')}" autocomplete="off">
    <label class="f" for="f-artist">Artist</label><input class="t" id="f-artist" value="${esc(v.artist||'')}" autocomplete="off">
    <label class="f" for="f-notes">Notes (strumming, tuning, reminders)</label><textarea class="t" id="f-notes" style="min-height:90px;font-family:var(--sans);font-size:16px;white-space:pre-wrap">${esc(s?s.notes||'':'')}</textarea>
    <div class="actions"><button class="btn" id="save">Save song</button>${s?'':'<button class="btn ghost" data-back>Cancel</button>'}</div>
    ${s?'':`<div class="find"><span>Need a chart?</span><a id="lk-ug" target="_blank" rel="noopener">Ultimate Guitar</a><a id="lk-ch" target="_blank" rel="noopener">Chordie</a><a id="lk-go" target="_blank" rel="noopener">Google</a><span>Select the chart text, copy, then paste it above.</span></div>`}
  </div>`;
  const body=$('#f-body'),title=$('#f-title'),artist=$('#f-artist');
  const detect=()=>{
    const n=body.value.split('\n').filter(l=>classify(l)==='chord').length,k=estimateKey(body.value);
    $('#detect').textContent=body.value.trim()?(n?`${n} chord lines found. Estimated key: ${keyName(k)}`:'No chord lines found yet. Check that chords sit on their own lines above the lyrics.'):'';
  };
  const links=()=>{
    if(s)return;
    const q=encodeURIComponent(((title.value+' '+artist.value).trim()||'')+' chords');
    $('#lk-ug').href='https://www.ultimate-guitar.com/search.php?search_type=title&value='+encodeURIComponent((title.value+' '+artist.value).trim());
    $('#lk-ch').href='https://www.chordie.com/search.php?q='+encodeURIComponent((title.value+' '+artist.value).trim());
    $('#lk-go').href='https://www.google.com/search?q='+q;
  };
  const clean=()=>{
    const n=normalizeImport(body.value);body.value=n.body;
    if(!title.value.trim()&&n.title) title.value=n.title;
    if(!artist.value.trim()&&n.artist) artist.value=n.artist;
    detect();links();
  };
  let dt=null;body.addEventListener('input',()=>{clearTimeout(dt);dt=setTimeout(detect,300);});
  body.addEventListener('paste',()=>setTimeout(clean,0));
  title.addEventListener('input',links);artist.addEventListener('input',links);
  $('#clean').addEventListener('click',()=>{clean();toast('Cleaned up');});
  $('#paste').addEventListener('click',async()=>{
    try{const t=await navigator.clipboard.readText();if(!t.trim()){toast('Clipboard is empty');return;}body.value=t;clean();toast('Pasted');}
    catch(e){toast('Paste blocked. Long-press in the box and choose Paste.');body.focus();}
  });
  $('#save').addEventListener('click',()=>{
    clean();
    if(!body.value.trim()){toast('Add the chart text first');return;}
    const rec=s||{id:uid(),fav:false,transpose:0,capo:0,speed:6,created:Date.now()};
    Object.assign(rec,{title:title.value.trim()||'Untitled',artist:artist.value.trim(),notes:$('#f-notes').value.trim(),body:body.value,key:estimateKey(body.value),deleted:false});
    data.songs[rec.id]=rec;touch(rec);
    location.replace('#/song/'+rec.id);
  });
  detect();links();
  if(!s&&!v.body) body.focus();
}

/* ================= settings, backup, sync ================= */
function viewSettings(){
  app.innerHTML=`<header class="top" style="padding-left:6px"><button class="ib" data-go="/" aria-label="Back">${I.back}</button><h1 class="brand" style="font-size:22px">Settings</h1></header>
  <div class="form">
    <label class="f" for="s-theme">Appearance</label>
    <select class="t" id="s-theme"><option value="auto">Match device</option><option value="dark">Dark</option><option value="light">Light</option></select>

    <h2 class="sec">Sync between devices</h2>
    <p class="hint">Optional. Your library always lives on this device. Add a free Supabase project (see README) to share it between your Pixel and iPad.</p>
    <div class="card">
      <label class="f" for="s-url">Project URL</label><input class="t" id="s-url" placeholder="https://xxxx.supabase.co" value="${esc(sync.url)}" autocapitalize="off" autocorrect="off" spellcheck="false">
      <label class="f" for="s-key">Anon public key</label><input class="t" id="s-key" value="${esc(sync.key)}" autocapitalize="off" autocorrect="off" spellcheck="false">
      <label class="f" for="s-email">Email</label><input class="t" id="s-email" type="email" value="${esc(sync.email)}" autocapitalize="off">
      <label class="f" for="s-pass">Password</label><input class="t" id="s-pass" type="password" autocomplete="current-password">
      <div class="actions"><button class="btn" id="s-in">Sign in and sync</button><button class="btn ghost" id="s-now">Sync now</button><button class="btn ghost" id="s-out">Sign out</button></div>
      <div class="status" id="s-stat"></div>
    </div>

    <h2 class="sec">Backup</h2>
    <p class="hint">Export a file with your whole library, or import one to merge it in.</p>
    <div class="actions"><button class="btn ghost" id="b-exp">Export library</button><button class="btn ghost" id="b-imp">Import library</button><input type="file" id="b-file" accept="application/json,.json" hidden></div>

    <h2 class="sec">Install</h2>
    <p class="hint">iPad: open in Safari, tap Share, then Add to Home Screen. Pixel: open in Chrome, tap the menu, then Install app. On the Pixel you can also select chart text on a website and Share it to Chordstand.</p>
  </div>`;
  $('#s-theme').value=prefs.theme;
  $('#s-theme').addEventListener('change',e=>{prefs.theme=e.target.value;savePrefs();applyTheme();});
  const grab=()=>{sync.url=$('#s-url').value.trim().replace(/\/+$/,'');sync.key=$('#s-key').value.trim();sync.email=$('#s-email').value.trim();saveSync();};
  const stat=m=>{const e=$('#s-stat');if(e)e.textContent=m;};
  statusSink=stat;
  stat(syncReady()?'Signed in as '+sync.email+(sync.last?'. Last synced '+new Date(sync.last).toLocaleString()+'.':'.'):'Not signed in.');
  $('#s-in').addEventListener('click',async()=>{
    grab();const pw=$('#s-pass').value;
    if(!sync.url||!sync.key||!sync.email||!pw){stat('Fill in all four fields.');return;}
    try{stat('Signing in\u2026');await signIn(sync.email,pw);$('#s-pass').value='';await syncNow(true);}catch(e){stat(e.message);}
  });
  $('#s-now').addEventListener('click',()=>{grab();syncNow(true);});
  $('#s-out').addEventListener('click',()=>{sync.session=null;saveSync();stat('Signed out. Your songs stay on this device.');});
  $('#b-exp').addEventListener('click',()=>{
    const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='chordstand-library-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();
  });
  $('#b-imp').addEventListener('click',()=>$('#b-file').click());
  $('#b-file').addEventListener('change',async e=>{
    const f=e.target.files[0];if(!f)return;
    try{const j=JSON.parse(await f.text());if(!j.songs)throw 0;merge(j);saveData();toast('Imported '+Object.keys(j.songs).length+' songs');queueSync();}
    catch(err){toast('That file is not a Chordstand library');}
  });
}
let statusSink=null;
const syncReady=()=>!!(sync.url&&sync.key&&sync.session);
let syncing=false;
async function sb(path,opts={}){
  const h={apikey:sync.key,'Content-Type':'application/json',...(opts.headers||{})};
  if(opts.auth!==false&&sync.session) h.Authorization='Bearer '+sync.session.access_token;
  return fetch(sync.url+path,{method:opts.method||'GET',headers:h,body:opts.body});
}
function takeSession(j){
  sync.session={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()+Math.max(60,(j.expires_in||3600)-60)*1000,user_id:(j.user&&j.user.id)||(sync.session&&sync.session.user_id)};
  saveSync();
}
async function signIn(email,password){
  const r=await sb('/auth/v1/token?grant_type=password',{method:'POST',auth:false,body:JSON.stringify({email,password})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error_description||j.msg||'Sign-in failed. Check the URL, key, email and password.');
  takeSession(j);
}
async function ensureSession(){
  if(!sync.session) throw new Error('Not signed in.');
  if(Date.now()<sync.session.expires_at) return;
  const r=await sb('/auth/v1/token?grant_type=refresh_token',{method:'POST',auth:false,body:JSON.stringify({refresh_token:sync.session.refresh_token})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){sync.session=null;saveSync();throw new Error('Session expired. Sign in again in Settings.');}
  takeSession(j);
}
function merge(remote){
  for(const kind of ['songs','setlists']){
    const src=remote[kind]||{};
    for(const id in src){const l=data[kind][id];if(!l||(src[id].updatedAt||0)>(l.updatedAt||0)) data[kind][id]=src[id];}
  }
}
async function syncNow(manual){
  if(!syncReady()||syncing) return;
  syncing=true;const say=m=>{if(statusSink)statusSink(m);};
  try{
    say('Syncing\u2026');
    await ensureSession();
    const r=await sb('/rest/v1/library?select=data');
    if(!r.ok) throw new Error('Could not read the library table ('+r.status+'). Did you run the SQL from the README?');
    const rows=await r.json();
    if(rows[0]&&rows[0].data) merge(rows[0].data);
    saveData();
    const p=await sb('/rest/v1/library?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:sync.session.user_id,data:{songs:data.songs,setlists:data.setlists},updated_at:new Date().toISOString()})});
    if(!p.ok) throw new Error('Could not save to the cloud ('+p.status+').');
    sync.last=Date.now();saveSync();
    say('Synced '+new Date(sync.last).toLocaleTimeString()+'.');
    if(manual) toast('Synced');
    const {path}=parseRoute();
    if(path==='/'&&!document.activeElement.matches('input')) {renderChips();renderList();}
  }catch(e){say(e.message||'Sync failed.');if(manual) toast('Sync failed');}
  finally{syncing=false;}
}

/* ================= global events ================= */
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('ch')&&P){e.preventDefault();chordSheet(e.target.dataset.ch);}
});
document.addEventListener('click',async e=>{
  const chEl=e.target.closest('.ch');
  if(chEl&&P){chordSheet(chEl.dataset.ch);return;}
  const t=e.target.closest('button,[data-open],[data-close],[data-go]');if(!t)return;
  const d=t.dataset;
  if('close' in d){closeSheet();return;}
  if(d.go){go(d.go);return;}
  if(d.goto){location.replace('#'+d.goto);return;}
  if('back' in d){history.length>1?history.back():go('/');return;}
  if(d.filter){state.filter=d.filter;renderChips();renderList();return;}
  if('newlist' in d){const sl=newSetlist();if(sl){state.filter=sl.id;renderChips();renderList();}return;}
  if(d.sl){
    const sl=data.setlists[state.filter];if(!sl)return;
    if(d.sl==='rename'){const n=(prompt('Rename setlist',sl.name)||'').trim();if(n){sl.name=n;touch(sl);renderChips();}}
    else if(confirm('Delete the setlist “'+sl.name+'”? Songs stay in your library.')){data.setlists[sl.id]={id:sl.id,deleted:true,created:sl.created,updatedAt:Date.now(),songIds:[],name:''};saveData();queueSync();state.filter='all';renderChips();renderList();}
    return;
  }
  if(d.mv){e.stopPropagation();moveInList(d.id,d.mv);return;}
  if(d.fav){
    e.stopPropagation();const s=data.songs[d.fav];s.fav=!s.fav;touch(s);
    t.classList.toggle('on',s.fav);if(state.filter==='fav') renderList();return;
  }
  if(d.open){go('/song/'+d.open+(data.setlists[state.filter]?'?list='+state.filter:''));return;}
  if('pfav' in d){const s=P.song;s.fav=!s.fav;touch(s);t.classList.toggle('on',s.fav);return;}
  if('menu' in d){songMenu();return;}
  if(d.a&&P){act(d.a);return;}
  if('edit' in d){go('/edit/'+P.song.id);return;}
  if('lists' in d){listsSheet();return;}
  if(d.tog){
    const sl=data.setlists[d.tog],id=P.song.id,i=sl.songIds.indexOf(id);
    if(i>=0) sl.songIds.splice(i,1); else sl.songIds.push(id);
    touch(sl);listsSheet();return;
  }
  if('newlistSong' in d){const sl=newSetlist(P.song.id);if(sl)listsSheet();return;}
  if('del' in d){
    const s=P.song;
    if(confirm('Delete “'+(s.title||'Untitled')+'”? This can\u2019t be undone.')){
      data.songs[s.id]={id:s.id,deleted:true,updatedAt:Date.now()};
      for(const l of liveLists()){const i=l.songIds.indexOf(s.id);if(i>=0){l.songIds.splice(i,1);l.updatedAt=Date.now();}}
      saveData();queueSync();location.replace('#/');
    }
  }
});
